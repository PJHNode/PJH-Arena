name: Deploy Arena Worker

# worker/arena-worker.js(또는 wrangler.toml/package.json)가 바뀐 채로 main에 push되면
# 자동으로 Cloudflare Worker "arena"를 배포한다. public/(정적 사이트)와는 완전히 별개
# 배포 대상이라 deploy-pages.yml과 분리된 워크플로우로 둔다.
on:
  push:
    branches: [main]
    paths:
      - 'worker/arena-worker.js'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
  workflow_dispatch: {}

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
